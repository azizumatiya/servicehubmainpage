<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Neon Glitch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* --- DESIGN TOKENS & CSS VARIABLES --- */
        :root {
            /* Colors */
            --color-bg: #0a0a0a;
            --color-surface: #1a1a1a;
            --color-text-primary: #f0f0f0;
            --color-text-secondary: #a0a0a0;
            --neon-pink: #ff006e;
            --neon-purple: #8338ec;
            --neon-blue: #3a86ff;
            --glitch-color-1: var(--neon-pink);
            --glitch-color-2: var(--neon-blue);

            /* Typography */
            --font-primary: 'Rajdhani', sans-serif;
            --font-accent: 'Orbitron', sans-serif;
            --font-size-base: 16px;
            --font-size-lg: 18px;
            --font-size-xl: 22px;
            --font-size-2xl: 28px;
            --font-size-3xl: 36px;
            --font-size-4xl: 72px;

            /* Spacing */
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-8: 64px;
        }

        /* --- GLOBAL RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--space-5);
        }

        h1, h2, h3 {
            font-family: var(--font-accent);
            font-weight: 900;
            text-transform: uppercase;
        }
        p {
            font-size: var(--font-size-lg);
            color: var(--color-text-secondary);
            max-width: 600px;
        }

        /* --- EXTREME HERO SECTION --- */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: var(--color-bg);
            overflow: hidden;
        }

        /* PARTICLE BACKGROUND */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* HERO CONTENT */
        .hero-content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
        }
        .hero-text-block {
            flex: 0 0 55%;
            padding-right: var(--space-6);
        }
        .hero-visual-block {
            flex: 0 0 40%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* GLITCH HEADLINE */
        .glitch-wrapper {
            position: relative;
            margin-bottom: var(--space-6);
        }
        .glitch {
            font-size: var(--font-size-4xl);
            font-weight: 900;
            text-transform: uppercase;
            position: relative;
            color: var(--color-text-primary);
            letter-spacing: 3px;
            text-shadow: 
                0.05em 0 0 rgba(255, 0, 0, 0.75),
                -0.025em -0.05em 0 rgba(0, 255, 0, 0.75),
                0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
            animation: glitch 500ms infinite;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch::before {
            animation: glitch-1 0.5s infinite;
            color: var(--glitch-color-1);
            z-index: -1;
        }
        .glitch::after {
            animation: glitch-2 0.5s infinite;
            color: var(--glitch-color-2);
            z-index: -2;
        }

        @keyframes glitch {
            0%, 100% { text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.05em -0.025em 0 rgba(0, 255, 0, 0.75), 0.025em 0.05em 0 rgba(0, 0, 255, 0.75); }
            14% { text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.05em -0.025em 0 rgba(0, 255, 0, 0.75), 0.025em 0.05em 0 rgba(0, 0, 255, 0.75); }
            15% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.75), 0.025em 0.025em 0 rgba(0, 255, 0, 0.75), -0.05em -0.05em 0 rgba(0, 0, 255, 0.75); }
            49% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.75), 0.025em 0.025em 0 rgba(0, 255, 0, 0.75), -0.05em -0.05em 0 rgba(0, 0, 255, 0.75); }
            50% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.75), 0.05em 0 0 rgba(0, 255, 0, 0.75), 0 -0.05em 0 rgba(0, 0, 255, 0.75); }
            99% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.75), 0.05em 0 0 rgba(0, 255, 0, 0.75), 0 -0.05em 0 rgba(0, 0, 255, 0.75); }
        }
        @keyframes glitch-1 {
            0%, 100% { clip-path: inset(62% 0 0 0); transform: translate(2px, -1px); }
            20% { clip-path: inset(11% 0 72% 0); transform: translate(-2px, 1px); }
            40% { clip-path: inset(67% 0 12% 0); transform: translate(2px, -1px); }
            60% { clip-path: inset(98% 0 0 0); transform: translate(-2px, 1px); }
            80% { clip-path: inset(24% 0 68% 0); transform: translate(2px, -1px); }
        }
        @keyframes glitch-2 {
            0%, 100% { clip-path: inset(0 0 84% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(0 0 42% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(0 0 5% 0); transform: translate(-2px, 1px); }
            60% { clip-path: inset(86% 0 0 0); transform: translate(2px, -1px); }
            80% { clip-path: inset(0 0 27% 0); transform: translate(-2px, 1px); }
        }

        .hero-subtitle {
            font-size: var(--font-size-xl);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-8);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* EXTREME BUTTONS */
        .btn-group {
            display: flex;
            gap: var(--space-5);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 32px;
            font-family: var(--font-accent);
            font-weight: 700;
            font-size: var(--font-size-lg);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            border-radius: 4px;
            z-index: 1;
        }
        .btn-neon {
            color: var(--color-text-primary);
            background-color: transparent;
            border-color: var(--neon-pink);
            box-shadow: inset 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
        }
        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--neon-pink), transparent);
            transition: left 0.5s;
            z-index: -1;
        }
        .btn-neon:hover {
            color: var(--color-bg);
            box-shadow: inset 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            transform: scale(1.05);
        }
        .btn-neon:hover::before {
            left: 100%;
        }
        .btn-solid {
            color: var(--color-bg);
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-blue));
            border: none;
            box-shadow: 0 4px 15px rgba(131, 56, 236, 0.4);
        }
        .btn-solid:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(131, 56, 236, 0.6);
        }

        /* HERO VISUAL - Abstract Geometric Shape */
        .hero-visual {
            width: 350px;
            height: 350px;
            position: relative;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        .visual-shape {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 180deg at 50% 50%, var(--neon-pink), var(--neon-purple), var(--neon-blue), var(--neon-pink));
            filter: blur(40px);
            opacity: 0.7;
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .visual-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border-radius: 20px;
            background-color: var(--color-surface);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px var(--neon-blue), inset 0 0 30px var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--neon-blue);
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 1024px) {
            .hero-content {
                flex-direction: column;
                text-align: center;
            }
            .hero-text-block {
                flex: 1;
                padding-right: 0;
                margin-bottom: var(--space-8);
            }
            .hero-visual-block {
                flex: 1;
            }
            .glitch {
                font-size: var(--font-size-3xl);
            }
            .btn-group {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 var(--space-4);
            }
            .glitch {
                font-size: var(--font-size-2xl);
                letter-spacing: 1px;
            }
            .hero-subtitle {
                font-size: var(--font-size-base);
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                max-width: 300px;
            }
            .hero-visual {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body>

    <!-- HERO SECTION -->
    <section class="hero">
        <!-- PARTICLE BACKGROUND -->
        <canvas id="particles-canvas"></canvas>

        <div class="container">
            <div class="hero-content">
                <div class="hero-text-block">
                    <div class="glitch-wrapper">
                        <h1 class="glitch" data-text="Enter The Grid">Enter The Grid</h1>
                    </div>
                    <p class="hero-subtitle">The future of tech is here. Are you ready to plug in?</p>
                    <p>We build digital experiences that are not just seen, but felt. Break the boundaries of the ordinary.</p>
                    <div class="btn-group">
                        <a href="#" class="btn btn-neon">Initiate Sequence</a>
                        <a href="#" class="btn btn-solid">Learn More</a>
                    </div>
                </div>
                <div class="hero-visual-block">
                    <div class="hero-visual">
                        <div class="visual-shape"></div>
                        <div class="visual-core">
                            <i class="fas fa-bolt"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // --- PARTICLE BACKGROUND ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const numberOfParticles = 100;
        const colors = ['#ff006e', '#8338ec', '#3a86ff', '#06ffa5'];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        init();
        animateParticles();

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particlesArray = []; // Reset particles
            init();
        });

    </script>

</body>
</html>
