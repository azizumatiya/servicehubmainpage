<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechConnect - Find Trusted Technicians</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #0ea5e9;
            --accent: #fbbf24;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: var(--text-dark);
            background-color: var(--white);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #0284c7;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background-color: var(--primary);
            color: white;
        }

        .section {
            padding: 80px 0;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-dark);
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-light);
            max-width: 700px;
            margin: 0 auto 50px;
            font-size: 1.1rem;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            z-index: 1000;
            padding: 15px 0;
            transition: all 0.3s ease;
        }

        .navbar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-search {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .nav-search input {
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            width: 200px;
        }

        .nav-search button {
            padding: 8px 15px;
            border-radius: 30px;
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            padding: 150px 0 100px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            position: relative;
            overflow: hidden;
        }

        .hero-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        .hero-content {
            flex: 1;
            z-index: 2;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--text-dark);
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: var(--text-light);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .hero-search {
            background-color: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .hero-search-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 16px;
        }

        .hero-search-select {
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 16px;
            min-width: 200px;
        }

        .hero-search-btn {
            padding: 15px 30px;
            border-radius: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .hero-search-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .hero-image {
            flex: 1;
            position: relative;
        }

        .hero-image img {
            width: 100%;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
        }

        .floating-card {
            position: absolute;
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 15px;
            animation: float 6s ease-in-out infinite;
        }

        .floating-card:nth-child(1) {
            top: 20%;
            left: -10%;
            animation-delay: 0s;
        }

        .floating-card:nth-child(2) {
            bottom: 15%;
            right: -5%;
            animation-delay: 2s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        /* Search Section */
        .search-section {
            background-color: var(--bg-light);
            padding: 30px 0;
            border-radius: 15px;
            margin-top: -50px;
            position: relative;
            z-index: 10;
            box-shadow: var(--shadow-lg);
            display: none;
        }

        .search-container {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 16px;
        }

        .search-select {
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 16px;
            min-width: 200px;
        }

        /* Categories Section */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .category-card {
            background-color: white;
            border-radius: 15px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .category-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
        }

        .category-icon {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .category-title {
            font-weight: 600;
            color: var(--text-dark);
        }

        /* How It Works Section */
        .how-it-works {
            background-color: var(--bg-light);
        }

        .steps-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-top: 50px;
        }

        .step {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .step-icon {
            width: 80px;
            height: 80px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
        }

        .step-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .step-description {
            color: var(--text-light);
            line-height: 1.6;
        }

        .steps-line {
            position: absolute;
            top: 40px;
            left: 10%;
            right: 10%;
            height: 4px;
            background-color: #e2e8f0;
            z-index: 1;
        }

        /* Featured Technicians */
        .slider-container {
            position: relative;
            overflow: hidden;
            margin-top: 50px;
        }

        .slider {
            display: flex;
            transition: transform 0.5s ease;
        }

        .technician-card {
            min-width: 300px;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-right: 20px;
        }

        .technician-image {
            height: 200px;
            width: 100%;
            object-fit: cover;
        }

        .technician-info {
            padding: 20px;
        }

        .technician-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .technician-category {
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .technician-rating {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .stars {
            color: var(--accent);
            margin-right: 10px;
        }

        .technician-price {
            font-weight: 600;
            margin-bottom: 15px;
        }

        .slider-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .slider-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slider-btn:hover {
            background-color: #1d4ed8;
        }

        /* Benefits Section */
        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .benefit-card {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .benefit-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .benefit-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
        }

        .benefit-icon {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .benefit-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .benefit-description {
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Reviews Section */
        .reviews-slider {
            position: relative;
            overflow: hidden;
            margin-top: 50px;
        }

        .reviews-track {
            display: flex;
            transition: transform 0.5s ease;
        }

        .review-card {
            min-width: 350px;
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-right: 20px;
        }

        .review-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .reviewer-image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }

        .reviewer-info {
            flex: 1;
        }

        .reviewer-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .review-date {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .review-rating {
            color: var(--accent);
            margin-bottom: 15px;
        }

        .review-text {
            color: var(--text-light);
            line-height: 1.6;
        }

        /* CTA Section */
        .cta-section {
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1581094794329-c8112a89af12?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 100px 0;
        }

        .cta-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .cta-subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-cta {
            background-color: var(--accent);
            color: var(--text-dark);
            font-size: 1.1rem;
            padding: 15px 30px;
        }

        .btn-cta:hover {
            background-color: #f59e0b;
        }

        /* Footer */
        .footer {
            background-color: var(--text-dark);
            color: white;
            padding: 70px 0 20px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            margin-bottom: 50px;
        }

        .footer-column h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 10px;
        }

        .footer-column h3::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 2px;
            background-color: var(--accent);
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 10px;
        }

        .footer-links a {
            color: #cbd5e1;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background-color: var(--accent);
            color: var(--text-dark);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .hero-container {
                flex-direction: column;
            }

            .hero-title {
                font-size: 2.8rem;
            }

            .steps-container {
                flex-direction: column;
                gap: 30px;
            }

            .steps-line {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .hero-title {
                font-size: 2.2rem;
            }

            .hero-subtitle {
                font-size: 1.1rem;
            }

            .hero-search {
                flex-direction: column;
            }

            .hero-search-input, .hero-search-select {
                width: 100%;
            }

            .hero-buttons {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

            .section-title {
                font-size: 2rem;
            }

            .search-container {
                flex-direction: column;
            }

            .search-input, .search-select {
                width: 100%;
            }
        }

        @media (max-width: 576px) {
            .review-card, .technician-card {
                min-width: 280px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="container navbar-container">
            <a href="#" class="logo">TechConnect</a>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Technicians</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="nav-search" id="navSearch">
                <input type="text" placeholder="Location">
                <select>
                    <option>All Categories</option>
                    <option>Electrician</option>
                    <option>Plumber</option>
                    <option>AC Repair</option>
                    <option>Carpenter</option>
                    <option>Painter</option>
                    <option>IT Support</option>
                    <option>CCTV Technician</option>
                    <option>Appliance Repair</option>
                </select>
                <button>Search</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container hero-container">
            <div class="hero-content">
                <!-- <h1 class="hero-title">Find Trusted Technicians Near You</h1>
                <p class="hero-subtitle">Connect with verified professionals for all your home service needs. Fast, reliable, and affordable solutions at your fingertips.</p>
                 -->
                <!-- Search Bar in Hero Section -->
                <div class="hero-search">
                    <input type="text" class="hero-search-input" placeholder="Enter your location">
                    <select class="hero-search-select">
                        <option>All Categories</option>
                        <option>Electrician</option>
                        <option>Plumber</option>
                        <option>AC Repair</option>
                        <option>Carpenter</option>
                        <option>Painter</option>
                        <option>IT Support</option>
                        <option>CCTV Technician</option>
                        <option>Appliance Repair</option>
                    </select>
                    <button class="hero-search-btn">Search</button>
                </div>
                
                <div class="hero-buttons">
                    <a href="#" class="btn btn-primary">Hire Technician</a>
                    <a href="#" class="btn btn-secondary">Become Technician</a>
                </div>
            </div>
           
        </div>
    </section>

    <!-- Search Section (Hidden by default) -->
    <section class="search-section" id="searchSection">
        <div class="container search-container">
            <input type="text" class="search-input" placeholder="Enter your location">
            <select class="search-select">
                <option>All Categories</option>
                <option>Electrician</option>
                <option>Plumber</option>
                <option>AC Repair</option>
                <option>Carpenter</option>
                <option>Painter</option>
                <option>IT Support</option>
                <option>CCTV Technician</option>
                <option>Appliance Repair</option>
            </select>
            <button class="btn btn-primary">Search</button>
        </div>
    </section>

    <script>
        // Search section animation on scroll
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            const searchSection = document.getElementById('searchSection');
            const navSearch = document.getElementById('navSearch');
            
            if (window.scrollY > 100) {
                navbar.style.padding = '10px 0';
                navSearch.style.display = 'flex';
                searchSection.style.opacity = '0';
                searchSection.style.pointerEvents = 'none';
            } else {
                navbar.style.padding = '15px 0';
                navSearch.style.display = 'none';
                searchSection.style.opacity = '1';
                searchSection.style.pointerEvents = 'auto';
            }
        });

        // Technician slider
        const technicianSlider = document.getElementById('technicianSlider');
        const prevTechnician = document.getElementById('prevTechnician');
        const nextTechnician = document.getElementById('nextTechnician');
        let technicianPosition = 0;
        const technicianCardWidth = 320; // card width + margin

        prevTechnician.addEventListener('click', function() {
            if (technicianPosition < 0) {
                technicianPosition += technicianCardWidth;
                technicianSlider.style.transform = `translateX(${technicianPosition}px)`;
            }
        });

        nextTechnician.addEventListener('click', function() {
            const maxPosition = -(technicianSlider.children.length - 3) * technicianCardWidth;
            if (technicianPosition > maxPosition) {
                technicianPosition -= technicianCardWidth;
                technicianSlider.style.transform = `translateX(${technicianPosition}px)`;
            }
        });

        // Reviews slider
        const reviewsTrack = document.getElementById('reviewsTrack');
        const prevReview = document.getElementById('prevReview');
        const nextReview = document.getElementById('nextReview');
        let reviewPosition = 0;
        const reviewCardWidth = 370; // card width + margin

        prevReview.addEventListener('click', function() {
            if (reviewPosition < 0) {
                reviewPosition += reviewCardWidth;
                reviewsTrack.style.transform = `translateX(${reviewPosition}px)`;
            }
        });

        nextReview.addEventListener('click', function() {
            const maxPosition = -(reviewsTrack.children.length - 3) * reviewCardWidth;
            if (reviewPosition > maxPosition) {
                reviewPosition -= reviewCardWidth;
                reviewsTrack.style.transform = `translateX(${reviewPosition}px)`;
            }
        });

        // Auto-scroll for sliders
        setInterval(function() {
            const maxPosition = -(technicianSlider.children.length - 3) * technicianCardWidth;
            if (technicianPosition > maxPosition) {
                technicianPosition -= technicianCardWidth;
                technicianSlider.style.transform = `translateX(${technicianPosition}px)`;
            } else {
                technicianPosition = 0;
                technicianSlider.style.transform = `translateX(${technicianPosition}px)`;
            }
        }, 5000);

        setInterval(function() {
            const maxPosition = -(reviewsTrack.children.length - 3) * reviewCardWidth;
            if (reviewPosition > maxPosition) {
                reviewPosition -= reviewCardWidth;
                reviewsTrack.style.transform = `translateX(${reviewPosition}px)`;
            } else {
                reviewPosition = 0;
                reviewsTrack.style.transform = `translateX(${reviewPosition}px)`;
            }
        }, 4000);

        // Benefits animation on scroll
        const benefitCards = document.querySelectorAll('.benefit-card');
        
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        benefitCards.forEach(card => {
            observer.observe(card);
        });

        // Touch support for sliders
        let touchStartX = 0;
        let touchEndX = 0;

        technicianSlider.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        });

        technicianSlider.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe(technicianSlider, technicianCardWidth, technicianPosition);
        });

        reviewsTrack.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        });

        reviewsTrack.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe(reviewsTrack, reviewCardWidth, reviewPosition);
        });

        function handleSwipe(slider, cardWidth, position) {
            if (touchEndX < touchStartX - 50) {
                // Swipe left
                const maxPosition = -(slider.children.length - 3) * cardWidth;
                if (position > maxPosition) {
                    position -= cardWidth;
                    slider.style.transform = `translateX(${position}px)`;
                }
            }
            
            if (touchEndX > touchStartX + 50) {
                // Swipe right
                if (position < 0) {
                    position += cardWidth;
                    slider.style.transform = `translateX(${position}px)`;
                }
            }
        }
    </script>
</body>
</html>
