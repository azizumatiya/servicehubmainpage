<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - TechConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* --- DESIGN TOKENS & CSS VARIABLES --- */
        :root {
            /* Colors - Softer & Modern Palette */
            --color-primary: #0056b3;
            --color-accent: #00a8cc;
            --color-bg-primary: #fdfdfd;
            --color-bg-secondary: #f0f4f8;
            --color-text-primary: #1a202c;
            --color-text-secondary: #4a5568;
            --gradient-primary: linear-gradient(135deg, var(--color-primary), var(--color-accent));

            /* Typography */
            --font-family: 'Inter', sans-serif;
            --font-size-base: 16px;
            --font-size-lg: 18px;
            --font-size-xl: 20px;
            --font-size-2xl: 24px;
            --font-size-3xl: 32px;
            --font-size-4xl: 42px; /* Reduced from 52px */

            /* Spacing - Reduced for a more compact layout */
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px; /* Reduced from 24px */
            --space-6: 24px; /* Reduced from 32px */
            --space-7: 32px; /* Reduced from 40px */
            --space-8: 48px; /* Reduced from 64px */
            --space-9: 72px; /* Reduced from 100px */

            /* Border Radius */
            --radius-md: 12px;
            --radius-lg: 20px;

            /* Shadows */
            --shadow-md: 0 4px 20px rgba(0, 86, 179, 0.08);
            --shadow-lg: 0 10px 40px rgba(0, 86, 179, 0.12);
        }

        /* --- GLOBAL RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-bg-secondary);
            color: var(--color-text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1100px; /* Reduced from 1280px */
            margin: 0 auto;
            padding: 0 var(--space-5); /* Consistent padding */
        }

        h1 {
            font-weight: 800;
            font-size: var(--font-size-4xl);
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        p {
            font-size: var(--font-size-lg);
            color: var(--color-text-secondary);
            font-weight: 400;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px; /* Slightly reduced padding */
            border-radius: 50px;
            font-weight: 600;
            font-size: var(--font-size-base);
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
            gap: 8px;
        }
        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: var(--shadow-md);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .btn-outline {
            background: transparent;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
        }
        .btn-outline:hover {
            background: var(--color-primary);
            color: white;
            transform: translateY(-2px);
        }

        /* --- HERO SECTION --- */
        .hero {
            padding: var(--space-9) 0; /* Reduced padding */
            background: var(--color-bg-primary);
            position: relative;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0, 168, 204, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 86, 179, 0.03) 0%, transparent 50%),
                var(--color-bg-primary);
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -15%;
            right: -15%;
            width: 400px; /* Reduced size */
            height: 400px; /* Reduced size */
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 168, 204, 0.08) 0%, rgba(0, 168, 204, 0) 70%);
            z-index: 0;
        }
        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-6); /* Reduced gap */
            align-items: center;
            position: relative;
            z-index: 1;
            min-height: 60vh; /* Reduced from 80vh for a smaller feel */
        }
        .hero-text h1 {
            margin-bottom: var(--space-4); /* Reduced margin */
            color: var(--color-text-primary);
        }
        .dynamic-highlight {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            transition: opacity 0.6s ease-in-out;
        }
        .hero-text p {
            margin-bottom: var(--space-6); /* Reduced margin */
            max-width: 460px; /* Slightly reduced max-width */
        }
        .hero-cta {
            display: flex;
            gap: var(--space-4); /* Reduced gap */
            flex-wrap: wrap;
        }
        .hero-visual {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px; /* Reduced height */
        }
        
        /* --- STACKED IMAGE LAYOUT STYLES (REVISED) --- */
        .stacked-image-container {
            position: relative;
            width: 100%;
            max-width: 420px; /* Reduced from 480px */
            height: 400px; /* Reduced height */
        }

        .stacked-image {
            position: absolute;
            width: 80%;
            height: auto;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            background-color: #fff;
            overflow: hidden;
            border: 6px solid white; /* Slightly smaller border */
        }

        .stacked-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* More subtle positioning and rotation */
        .stacked-image.item-1 {
            top: 0%;
            left: 5%;
            z-index: 1;
            transform: rotate(-3deg);
        }
        .stacked-image.item-2 {
            top: 8%;
            right: 0%;
            z-index: 2;
            transform: rotate(2deg);
        }
        .stacked-image.item-3 {
            bottom: 5%;
            left: 0%;
            z-index: 3;
            transform: rotate(1deg);
        }
        .stacked-image.item-4 {
            bottom: 12%;
            right: 5%;
            z-index: 4;
            transform: rotate(-2deg);
        }

        /* Refined hover effect */
        .stacked-image:hover {
            z-index: 10 !important;
            transform: rotate(0deg) scale(1.05) !important;
            box-shadow: var(--shadow-lg);
        }
        
        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 1024px) { /* Tablet */
            .container {
                padding: 0 var(--space-4);
            }
            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
                gap: var(--space-6);
            }
            .hero-visual {
                margin-top: 0;
                min-height: 350px; /* Reduced height */
            }
            .stacked-image-container {
                max-width: 350px; /* Reduced size */
                height: 350px; /* Reduced height */
            }
            .hero-cta {
                justify-content: center;
            }
            h1 {
                font-size: var(--font-size-3xl);
            }
        }

        @media (max-width: 768px) { /* Mobile */
            .container {
                padding: 0 var(--space-4);
            }
            h1 {
                font-size: var(--font-size-2xl); /* 24px */
            }
            p {
                font-size: var(--font-size-base); /* 16px */
            }
            .hero-cta {
                flex-direction: column;
                width: 100%;
                align-items: stretch;
            }
            .btn {
                width: 100%;
                justify-content: center;
                padding: 10px 20px; /* Smaller padding on mobile */
            }
            .hero-visual {
                min-height: 300px; /* Reduced height */
            }
            .stacked-image-container {
                max-width: 280px; /* Significantly smaller for mobile */
                height: 280px; /* Significantly smaller for mobile */
            }
            .stacked-image {
                width: 90%;
                border: 4px solid white; /* Smaller border on mobile */
            }
            /* Reduce overlap on smaller screens */
            .stacked-image.item-1 { top: -5%; left: 0%; }
            .stacked-image.item-2 { top: 5%; right: -5%; }
            .stacked-image.item-3 { bottom: 0%; left: -5%; }
            .stacked-image.item-4 { bottom: 5%; right: 0%; }
        }
    </style>
</head>
<body>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-text">
                    <h1>Find Trusted <span class="dynamic-highlight" id="dynamicWord">Electricians</span> Near You</h1>
                    <p>Connect with certified professionals for your home and office needs. Get instant quotes and book with confidence.</p>
                    <div class="hero-cta">
                        <a href="#" class="btn btn-primary">Book a Pro <i class="fas fa-arrow-right"></i></a>
                        <a href="#" class="btn btn-outline">Explore Services</a>
                    </div>
                </div>
                <div class="hero-visual">
                    <!-- STACKED IMAGE LAYOUT -->
                    <div class="stacked-image-container">
                        <a href="#" class="stacked-image item-1" data-service="Electrician">
                            <img src="https://images.pexels.com/photos/4109111/pexels-photo-4109111.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Certified Electrician">
                        </a>
                        <a href="#" class="stacked-image item-2" data-service="Plumber">
                            <img src="https://images.pexels.com/photos/414612/pexels-photo-414612.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Expert Plumber">
                        </a>
                        <a href="#" class="stacked-image item-3" data-service="AC Expert">
                            <img src="https://images.pexels.com/photos/406014/pexels-photo-406014.jpeg?auto=compress&cs=tinysrgb&w=600" alt="AC Repair Specialist">
                        </a>
                        <a href="#" class="stacked-image item-4" data-service="Carpenter">
                            <img src="https://images.pexels.com/photos/5077068/pexels-photo-5077068.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Skilled Carpenter">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DYNAMIC KEYWORD HIGHLIGHTER ---
            const words = ["Electricians", "Plumbers", "AC Experts", "Carpenters", "Home Cleaners"];
            let wordIndex = 0;
            const dynamicWordElement = document.getElementById('dynamicWord');

            function changeWord() {
                dynamicWordElement.style.opacity = '0';
                setTimeout(() => {
                    wordIndex = (wordIndex + 1) % words.length;
                    dynamicWordElement.textContent = words[wordIndex];
                    dynamicWordElement.style.opacity = '1';
                }, 600);
            }

            // Initialize
            dynamicWordElement.style.opacity = '1';
            setInterval(changeWord, 2800);

            // --- CLICKABLE STACKED IMAGE HANDLER ---
            const stackedImages = document.querySelectorAll('.stacked-image');

            stackedImages.forEach(item => {
                item.addEventListener('click', (event) => {
                    event.preventDefault();
                    
                    const serviceType = item.getAttribute('data-service');
                    
                    // Action to perform on click
                    alert(`You clicked on the ${serviceType} image!`);
                    
                    console.log(`Stacked image for ${serviceType} was clicked.`);
                });
            });
        });
    </script>

</body>
</html>
